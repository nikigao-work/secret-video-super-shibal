name: Publish birthday site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Fetch and verify pinned static files
        shell: bash
        run: |
          python3 - <<'PY'
          """Fetch a pinned public static site and reject missing, changed or unsafe files."""
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path, PurePosixPath
          from urllib.parse import urlsplit, urljoin, quote, urlencode
          from urllib.request import Request, urlopen
          import argparse
          import hashlib
          import json
          import re
          import time


          def validate_manifest(manifest):
              base = urlsplit(manifest['sourceUrl'])
              if base.scheme != 'https' or not base.hostname or base.username or base.password or base.query or base.fragment:
                  raise ValueError('A public HTTPS source URL without credentials/query is required.')
              files = manifest['files']
              paths = [entry['path'] for entry in files]
              if not files or 'index.html' not in paths or len(paths) != len(set(paths)):
                  raise ValueError('Manifest needs unique files and a root index.html.')
              for entry in files:
                  path = PurePosixPath(entry['path'])
                  if path.is_absolute() or '\\' in entry['path'] or ':' in entry['path'] or any(part in ('..', '.') or part.startswith('.') for part in path.parts):
                      raise ValueError('Unsafe manifest path: ' + entry['path'])
                  if str(path) != entry['path'] or not re.fullmatch(r'[0-9a-f]{64}', entry['sha256']):
                      raise ValueError('Invalid manifest entry: ' + entry['path'])
                  if not isinstance(entry['bytes'], int) or entry['bytes'] < 0 or entry['bytes'] >= 100 * 1024 * 1024:
                      raise ValueError('Unexpected file size: ' + entry['path'])
              return files


          def fetch_one(base_url, destination, entry):
              url = urljoin(base_url.rstrip('/') + '/', quote(entry['path'], safe='/'))
              url += '?' + urlencode({'snapshot': entry['sha256']})
              target = destination / entry['path']
              target.parent.mkdir(parents=True, exist_ok=True)
              last_error = None
              for attempt in range(3):
                  try:
                      request = Request(url, headers={'User-Agent': 'Mozilla/5.0 Polina-Pages-Build/1.0', 'Accept-Encoding': 'identity'})
                      with urlopen(request, timeout=60) as response:
                          if urlsplit(response.geturl()).hostname != urlsplit(base_url).hostname:
                              raise ValueError('Unexpected redirect for ' + entry['path'])
                          data = response.read(entry['bytes'] + 1)
                      if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                          raise ValueError('Size or SHA-256 mismatch: ' + entry['path'])
                      target.write_bytes(data)
                      return entry['path']
                  except Exception as error:
                      last_error = error
                      if attempt < 2:
                          time.sleep(attempt + 1)
              raise RuntimeError('Cannot fetch verified file ' + entry['path']) from last_error


          def download_site(manifest, destination):
              files = validate_manifest(manifest)
              destination = Path(destination).resolve()
              if destination.exists() and any(destination.iterdir()):
                  raise ValueError('Output directory must be empty: ' + str(destination))
              destination.mkdir(parents=True, exist_ok=True)
              with ThreadPoolExecutor(max_workers=6) as pool:
                  jobs = [pool.submit(fetch_one, manifest['sourceUrl'], destination, entry) for entry in files]
                  for job in jobs:
                      print('Verified ' + job.result(), flush=True)
              print(f'All {len(files)} files verified. GitHub Pages will serve these local copies.')


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('manifest', type=Path)
              parser.add_argument('--output', type=Path, default=Path('_site'))
              args = parser.parse_args()
              download_site(json.loads(args.manifest.read_text(encoding='utf-8')), args.output)



