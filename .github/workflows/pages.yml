476, "sha256": "bf9e20d98e17942c1c55cc5ee72a1408b8f81fd75f2e8726d9c42dddca5d51e7"}, {"path": "quiz-data.js", "bytes": 3486, "sha256": "bcc7cb6b422f3b3b8cf9c4e296cadc2e0c1e5a541d2883adfe8476d5744a2062"}, {"path": "styles.css", "bytes": 21385, "sha256": "17288cd4ca9f44ecaa689b3c758b88b08831d29baa34fbf3705c1ace34ea7f63"}]}'), Path('_site'))
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
